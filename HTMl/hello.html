<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=
  , initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .box1{
    border: 2px solid;
    width:50%;
    /* height: 500px; */
    padding: 20px;
  }

  .box4{
    width: 100%;
    height: 50%;
    padding: 10px;
    display: flex;
    gap: 20px;
  }

  .box5{
    width: 100%;
    border: 2px solid;
    height: 400px;
    margin-top: 40px;
  }

  .box2{
    height: 100px;
    width: 100%;
    border: 2px solid;
  }
  .box3{
    height: 100px;
    width: 100%;
    border: 2px solid;
  }

  
</style>
<body>
  <div class="box1">
    <div class = "box4">
      <div class="box2"></div>
      <div class="box3"></div>
    </div>
    <div class="box5"></div>
  </div>
</body>
</html>
